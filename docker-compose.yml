services:
  ota-analyzer:
    build: .
    container_name: ota-analyzer
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/uploads
      TAGS_FILE: /app/config/tags.json
    volumes:
      - ./Raw Data:/app/data
      - ./uploads:/app/uploads
      - ./config:/app/config
    restart: unless-stopped
